<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fakture</title>
  <style>
    :root {
      --bg: #e9edf1;
      --panel: #ffffff;
      --ink: #12304a;
      --muted: #5b6f80;
      --line: #c8d2dc;
      --signal: #e8590c;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

    header {
      background: var(--ink); color: #fff;
      padding: 14px clamp(16px, 4vw, 48px);
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    header strong { font-size: 1.1rem; letter-spacing: .02em; }
    header a { color: #b9c9d8; font-size: .95rem; }
    header a:hover { color: #fff; }

    main { max-width: 960px; margin: 0 auto; padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 32px); }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 6px; }
    .lead { color: var(--muted); margin: 0 0 24px; }

    .table-wrap { background: var(--panel); border: 1px solid var(--line); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-size: .9rem; color: var(--muted); font-weight: 600; background: #f3f6f9; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f3f6f9; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td a.open { color: var(--signal); font-weight: 600; }
    td a.open:hover { text-decoration: underline; }

    .empty { padding: 32px 18px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <strong>Špedicija</strong>
    <a href="{% url 'home_page' %}">Nazad na početnu</a>
  </header>

  <main>
    <h1>Fakture</h1>
    <p class="lead">Ukupno: {{ invoices|length }}</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Broj</th>
            <th>Datum</th>
            <th>Pošiljka</th>
            <th class="num">Iznos</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for invoice in invoices %}
          <tr>
            <td>#{{ invoice.pk }}</td>
            <td>{{ invoice.date|date:"d.m.Y." }}</td>
            <td>{{ invoice.shipment }}</td>
            <td class="num">{{ invoice.price }}</td>
            <td class="num"><a class="open" href="{% url 'invoice' invoice.pk %}">Otvori PDF</a></td>
          </tr>
          {% empty %}
          <tr><td colspan="5" class="empty">Još nema nijedne fakture.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
